[package]
name = "freeport-engine"
version = "1.1.0"
edition = "2021"
description = "Freeport's desktop engine: WARP tunnel, region unlock and local proxies"
license = "GPL-3.0-only"
build = "build.rs"

[lib]
name = "freeport_engine"

[dependencies]
warp = { path = "../../../warp-src/warp", default-features = false }
tokio = { version = "1.52", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "json", "stream"] }
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Networking_WinInet"] }
