# Builds Freeport for Windows and macOS and attaches the installers to the
# release. Runs when a release is published, or by hand from the Actions tab
# (then the files are left as workflow artifacts).
name: desktop

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            arch: arm64
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            arch: amd64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: freeport

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # BoringSSL's Windows build wants NASM for its assembly.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Core sources
        run: freeport/desktop/scripts/fetch-core.sh

      - name: Psiphon
        run: freeport/desktop/scripts/build-psiphon.sh ${{ matrix.arch }}

      - name: Tests
        working-directory: freeport/desktop
        run: cargo test -p freeport-engine -p freeport-desktop

      - name: Build
        working-directory: freeport/desktop/app
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build
        run: npx -y @tauri-apps/cli@2 build --target ${{ matrix.target }}

      - name: Collect
        id: collect
        run: |
          version="$(grep -m1 '"version"' freeport/desktop/app/tauri.conf.json | sed -E 's/.*"([0-9.]+)".*/\1/')"
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"
          bundle="freeport/desktop/target/${{ matrix.target }}/release/bundle"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$bundle"/nsis/*.exe "$out/freeport-$version-windows-x64-setup.exe"
          else
            cp "$bundle"/dmg/*.dmg "$out/freeport-$version-${{ matrix.name }}.dmg"
          fi
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: freeport-${{ matrix.name }}
          path: out/*

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/* --clobber --repo "${{ github.repository }}"
